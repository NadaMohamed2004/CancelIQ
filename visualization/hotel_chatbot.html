<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hotel Cancellation Assistant</title>
<style>
:root{
  --bg:#f8f3ec; --card:#ffffff; --ink:#3b2a22; --muted:#7a6a60; --line:#e6dccf;
  --brown:#6b3a2a; --teal:#5b8c8a; --terra:#b5624a; --green:#6f8f68; --amber:#b98a1f;
  --bubble-user:#6b3a2a; --bubble-user-ink:#fff; --bubble-bot:#f1e9dd; --soft-red:#f6e3de; --soft-green:#e6eee2; --soft-amber:#f8ecd3;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1714; --card:#2a211d; --ink:#f0e6dc; --muted:#b5a598; --line:#41342d;
    --brown:#c98f77; --teal:#7db5b2; --terra:#e08b73; --green:#93b58a; --amber:#e0b24f;
    --bubble-user:#8a4c37; --bubble-user-ink:#fff; --bubble-bot:#372b25; --soft-red:#4a2a24; --soft-green:#2d3a2a; --soft-amber:#4a3d22;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1714; --card:#2a211d; --ink:#f0e6dc; --muted:#b5a598; --line:#41342d;
  --brown:#c98f77; --teal:#7db5b2; --terra:#e08b73; --green:#93b58a; --amber:#e0b24f;
  --bubble-user:#8a4c37; --bubble-user-ink:#fff; --bubble-bot:#372b25; --soft-red:#4a2a24; --soft-green:#2d3a2a; --soft-amber:#4a3d22;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.app{max-width:1180px;margin:0 auto;padding:14px;display:flex;flex-direction:column;min-height:100%;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-style:italic;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--brown);color:#fff;border-color:var(--brown)}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start;flex:1}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.chat{display:flex;flex-direction:column;height:min(74vh,720px);min-height:420px}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 8px}
.msg{max-width:92%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--bubble-user);color:var(--bubble-user-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--bubble-bot);border-bottom-left-radius:4px}
.msg b{font-weight:650}
.msg .num{font-variant-numeric:tabular-nums}
.msg table{border-collapse:collapse;margin:6px 0;font-size:13px;width:100%}
.msg th,.msg td{border-bottom:1px solid var(--line);padding:3px 8px 3px 0;text-align:left;white-space:nowrap}
.msg .tscroll{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--brown)}
.inputrow{display:flex;gap:8px;margin-top:8px}
input[type=text],input[type=number],select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 10px;font:inherit;min-height:38px}
button.send{border:0;background:var(--brown);color:#fff;border-radius:9px;padding:0 16px;font:inherit;cursor:pointer;min-height:38px}
button.send:disabled{opacity:.5;cursor:default}
button.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:0 12px;font:inherit;cursor:pointer;min-height:38px}
h2{font-size:16px;margin:0 0 4px;font-style:italic}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:10px}
.form label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.form .full{grid-column:1/-1}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:8px}
.result{margin-top:12px;border-radius:12px;padding:12px;background:var(--soft-amber)}
.result.low{background:var(--soft-green)} .result.high{background:var(--soft-red)}
.big{font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.result.high .big{color:var(--terra)} .result.low .big{color:var(--green)} .result.medium .big{color:var(--amber)}
.bar{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--amber),var(--terra));position:relative;margin:10px 0 4px}
.bar i{position:absolute;top:-4px;width:4px;height:18px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
.bar u{position:absolute;top:-2px;width:2px;height:14px;background:var(--muted);opacity:.7}
.legend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.wi{margin:8px 0 0;padding:0;list-style:none;font-size:13px}
.wi li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line)}
.up{color:var(--terra)} .down{color:var(--green)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.typing{opacity:.7;font-style:italic}
footer{font-size:12px;color:var(--muted);text-align:center;padding-bottom:6px}
.stop{margin-left:6px}
[dir=rtl] .msg th,[dir=rtl] .msg td{text-align:right;padding:3px 0 3px 8px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1 id="t_title">Hotel cancellation assistant</h1>
      <div class="sub" id="t_sub">Ask about the dashboard, or score a booking with the real model.</div>
    </div>
    <div class="tools">
      <button class="pill" id="langBtn" aria-pressed="false" title="Reply language">EN</button>
      <button class="pill" id="aiBtn" aria-pressed="false" hidden title="Let Claude answer free-form questions using the dashboard facts">Ask Claude</button>
      <button class="pill" id="themeBtn" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <div class="grid">
    <section class="card chat" aria-label="Chat">
      <div id="log" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
      <div class="inputrow">
        <input type="text" id="q" autocomplete="off" placeholder="Ask e.g. “Why do non-refundable bookings cancel?”">
        <button class="send" id="send">Send</button>
      </div>
    </section>

    <aside class="card" aria-label="Booking risk calculator">
      <h2 id="t_calc">Score a booking</h2>
      <div class="sub" id="t_calc_sub">Runs the updated XGBoost model in your browser. Booking values stay on this page.</div>
      <div class="form" id="form"></div>
      <details><summary id="t_more">More options</summary><div class="form" id="form2"></div></details>
      <div class="inputrow"><button class="send" id="scoreBtn" style="flex:1">Calculate risk</button><button class="ghost" id="resetBtn">Reset</button></div>
      <div id="result"></div>
    </aside>
  </div>
  <footer id="t_foot"></footer>
</div>

  PACK.num.cols.forEach((c,i) => { x[FIDX['num__'+c]] = (g[c] - PACK.num.mean[i]) / PACK.num.scale[i]; });
  PACK.cat.cols.forEach((c,i) => { const k = 'cat__'+c+'_'+g[c]; if (k in FIDX) x[FIDX[k]] = 1; });
  PACK.hc.cols.forEach(c => { const m = PACK.hc.freq[c]; x[FIDX['hc__'+c]] = (m[g[c]] || 0); /* unseen category -> 0.0, like the Python FrequencyEncoder */ });
  return x;
}
function margin(x){
  let s = PACK.base_margin;
  for (const t of TREES){
    let i = 0;
    while (t[i][0] >= 0){ const n = t[i]; i = x[n[0]] < n[1] ? n[2] : n[3]; }
    s += t[i][5];
  }
  return s;
}
function calibrated(raw){ return sigmoid(PACK.meta.platt_a * logit(raw) + PACK.meta.platt_b); }
function riskOf(f){ const raw = sigmoid(margin(vectorize(f))); return {raw, p: calibrated(raw)}; }
function levelOf(p){ return p >= PACK.meta.threshold ? 'High' : p >= PACK.meta.low ? 'Medium' : 'Low'; }

/* ========================= TEXT → BOOKING FIELDS ========================= */
function parseBooking(t){
  const s = t.toLowerCase(); const f = {}; let hits = 0;
  const num = (re) => { const m = s.match(re); return m ? parseFloat(m[1]) : null; };
  let v;
  if ((v = num(/lead[\s-]*time[^\d]{0,12}(\d+)/) ?? num(/(\d+)\s*days?\s*(?:in advance|ahead|before|lead)/) ?? num(/(?:مدة|قبل)[^\d]{0,12}(\d+)/)) !== null){ f.lead_time = v; hits++; }
  if ((v = num(/adr[^\d]{0,8}(\d+(?:\.\d+)?)/) ?? num(/(?:€|eur|euro)\s*(\d+(?:\.\d+)?)/) ?? num(/(\d+(?:\.\d+)?)\s*(?:€|eur|euros?)/) ?? num(/(?:سعر|السعر)[^\d]{0,10}(\d+(?:\.\d+)?)/)) !== null){ f.adr = v; hits++; }
  if ((v = num(/(\d+)\s*nights?/) ?? num(/(\d+)\s*(?:ليل|ليالي|ليلة)/)) !== null){ const n = Math.round(v); f.stays_in_week_nights = Math.max(n - Math.min(Math.floor(n/3.5),n), 0); f.stays_in_weekend_nights = n - f.stays_in_week_nights; hits++; }
  if ((v = num(/(\d+)\s*special/) ?? num(/special\s*requests?[^\d]{0,6}(\d+)/) ?? num(/(\d+)\s*(?:طلبات|طلب)/)) !== null){ f.total_of_special_requests = Math.min(v,5); hits++; }
  if ((v = num(/(\d+)\s*(?:previous|prior|past)\s*cancel/) ?? num(/(?:previous|prior|past)\s*cancell?ations?[^\d]{0,6}(\d+)/)) !== null){ f.previous_cancellations = v; hits++; }
  if (/non[\s-]*refund|غير قابل للاسترداد|نون ريفند/.test(s)){ f.deposit_type = 'Non Refund'; hits++; }
  else if (/no[\s-]*deposit|بدون عربون/.test(s)){ f.deposit_type = 'No Deposit'; hits++; }
  else if (/\brefundable\b|قابل للاسترداد/.test(s)){ f.deposit_type = 'Refundable'; hits++; }
  const seg = [['online ta','Online TA'],['offline','Offline TA/TO'],['groups','Groups'],['group','Groups'],['corporate','Corporate'],['direct','Direct'],['aviation','Aviation'],['complementary','Complementary']];
  for (const [k,val] of seg){ if (s.includes(k)){ f.market_segment = val; f.distribution_channel = FACTS.channel_for[val] || DEFAULTS.distribution_channel; hits++; break; } }
  if (/resort/.test(s)){ f.hotel = 'Resort Hotel'; hits++; } else if (/city/.test(s)){ f.hotel = 'City Hotel'; hits++; }
  if (/repeat(?:ed)?\s*guest|returning guest|عميل متكرر/.test(s)){ f.is_repeated_guest = 1; hits++; }
  if (/\bcontract\b/.test(s)) { f.customer_type = 'Contract'; hits++; } else if (/transient[\s-]*party/.test(s)) { f.customer_type = 'Transient-Party'; hits++; } else if (/transient/.test(s)) { f.customer_type = 'Transient'; hits++; }
  MONTHS.forEach((m,i) => { if (s.includes(m.toLowerCase())){ f.arrival_month = i+1; hits++; } });
  return {f, hits};
}

const SCORE_VERB = /(score|predict|calculate|risk of|risk for|probab|what if|what-if|would.*cancel|will.*cancel|chance|احسب|توقع|احتمال|هل هيلغي|هيلغي|خطر حجز)/i;

let aiAvailable = false;
function route(text){
  const {f, hits} = parseBooking(text);
  if (hits >= 2 || (hits >= 1 && SCORE_VERB.test(text))) return {kind:'score', f};
  for (const [name, re] of INTENTS) if (re.test(text)) return {kind:'intent', name};
  if (hits === 1) return {kind:'score', f};
  return {kind:'none'};
}

const log = $('#log');
function addMsg(html, who, raw){
  const d = document.createElement('div'); d.className = 'msg ' + who; d.dir = 'auto';

}
function chips(){
  const sets = LANG === 'ar'
    ? ['ما أهم العوامل؟','اشرح الإيراد المعرّض للخطر','ليه Non Refund بيتلغي؟','كيف تُحسب مستويات الخطر؟','قائمة الانتظار','ملاحظات على البيانات','احسب خطر حجز non refund من Online TA مدة الحجز 150 والسعر 90']
    : ['What drives cancellations?','Explain revenue at risk','Why do non-refundable bookings cancel?','How are risk levels defined?','How does the waiting list work?','Data caveats','Score a non-refundable Online TA booking, lead time 150, ADR 90, 3 nights'];
  const box = $('#chips'); box.innerHTML = '';
  sets.forEach(s => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = s; b.onclick = () => ask(s); box.appendChild(b); });

let turns = [];
async function ask(text){
  text = (text || '').trim(); if (!text) return;
  $('#q').value = ''; addMsg(text, 'user', true);
  if (isAr(text)) setLang('ar', true);
  const r = route(text);
  if (r.kind === 'score'){
    const f = Object.assign({}, readForm(), r.f); setForm(f);
    const res = scoreBooking(f); const tmp = document.createElement('div'); renderResult(f, res, $('#result'));
    const changed = Object.keys(r.f).map(k => `${k} = <b>${esc(r.f[k])}</b>`).join(', ');
    addMsg(L(`Scored with the real model. Changed from the panel: ${changed}.\n<b>Cancellation risk ${(res.risk*100).toFixed(1)}% → ${res.level} risk</b> (${res.predicted_cancel ? 'expected to cancel' : 'expected to stay'}). The panel on the right shows what moves it.`,
             `تم الحساب بالنموذج الحقيقي. المتغيّرات من كلامك: ${changed}.\n<b>احتمال الإلغاء ${(res.risk*100).toFixed(1)}% ← خطر ${{High:'مرتفع',Medium:'متوسط',Low:'منخفض'}[res.level]}</b> (${res.predicted_cancel ? 'متوقع أن يُلغى' : 'متوقع أن يبقى'}). اللوحة اليمنى تعرض ما يغيّر النتيجة.`), 'bot');
    try{$('#result').scrollIntoView({block:'nearest'});}catch(e){} return;
  }
  if (aiAvailable && useAI){ await askClaude(text); return; }
  if (r.kind === 'intent'){ addMsg(A[r.name](), 'bot'); return; }
  if (aiAvailable && useAI !== false){ await askClaude(text); return; }
  addMsg(A.fallback(), 'bot');
}

let useAI = false, ctl = null;
async function askClaude(text){
  const bubble = addMsg(L('Analysing the latest project data…','جارٍ تحليل بيانات المشروع الجديدة…'),'bot');

    const response = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text}),signal:ctl.signal});
    const result = await response.json();
    if (!response.ok) throw Error(result.error || 'API error');
    bubble.textContent = result.answer;
  } catch(e){ bubble.textContent = L('API unavailable. Run python app.py and open localhost:8000.','الـAPI غير متاح. شغّل python app.py وافتح localhost:8000.') + ' ' + e.message; }
  finally {$('#send').disabled=false;}
}

(async()=>{try{const r=await fetch('/api/health');if(r.ok){aiAvailable=true;$('#aiBtn').hidden=false;$('#aiBtn').textContent='Data API';}}catch(e){}})();
